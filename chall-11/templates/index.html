<!DOCTYPE html>
<html>
<head>
  <title>Loja - Busca</title>
  <style>
    body { font-family: monospace; background: #0f0f1a; color: #e0e0e0; display: flex; justify-content: center; padding: 60px 20px; }
    .box { max-width: 600px; width: 100%; }
    h1 { color: #00ff88; }
    input { background: #0d0d1a; border: 1px solid #444; color: #e0e0e0; padding: 8px 12px; width: 70%; box-sizing: border-box; font-family: monospace; }
    button { background: #00ff88; color: #000; border: none; padding: 9px 16px; cursor: pointer; font-family: monospace; font-weight: bold; }
    .results { margin-top: 20px; }
    .result-item { border: 1px solid #333; padding: 10px; margin-bottom: 8px; }
    .debug-box { background: #0d1a0d; border: 1px solid #336633; padding: 12px; margin-top: 15px; }
    .flag { background: #0d2b0d; border: 1px solid #00ff88; padding: 15px; margin-top: 15px; font-size: 1.1em; }
  </style>
</head>
<body>
<div class="box">
  <h1>Busca de Produtos</h1>
  <form method="GET" action="search">
    <input type="text" name="q" value="{{ q or '' }}" placeholder="Buscar produto...">
    <button type="submit">Buscar</button>
  </form>

  {% if flag %}
  <div class="flag">{{ flag }}</div>
  {% elif debug %}
  <div class="debug-box">
    <strong>[DEBUG]</strong> Modo de diagnóstico ativo.<br>
  </div>
  {% elif results is defined %}
    {% if results %}
    <div class="results">
      {% for r in results %}
      <div class="result-item"><strong>{{ r.name }}</strong> — {{ r.desc }}</div>
      {% endfor %}
    </div>
    {% elif q %}
    <p>Nenhum resultado para "{{ q }}".</p>
    {% endif %}
  {% endif %}

</div>
</body>
</html>
