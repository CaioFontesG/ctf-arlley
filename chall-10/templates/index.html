<!DOCTYPE html>
<html>
<head>
  <title>Admin Panel - Acesso Negado</title>
  <style>
    body { font-family: monospace; background: #0f0f1a; color: #e0e0e0; display: flex; justify-content: center; padding: 60px 20px; }
    .box { max-width: 600px; width: 100%; }
    h1 { color: #ff4444; }
    .error { background: #1a0000; border: 1px solid #ff4444; padding: 15px; margin-top: 20px; }
    a { color: #00ff88; }
  </style>
</head>
<body>
<div class="box">
  {% if error %}
  <h1>Acesso Negado</h1>
  <div class="error">{{ error }}</div>
  {% else %}
  <h1 style="color:#00ff88">Painel Administrativo</h1>
  <p>Área restrita à rede interna da empresa.</p>
  {% endif %}
  <p>Rota protegida: <a href="admin">/admin</a></p>
</div>
</body>
</html>
