<!DOCTYPE html>
<html>
<head>
  <title>Dashboard Interno</title>
  <style>
    body { font-family: monospace; background: #0f0f1a; color: #e0e0e0; display: flex; justify-content: center; padding: 60px 20px; }
    .box { max-width: 600px; width: 100%; }
    h1 { color: #00ff88; }
    .card { border: 1px solid #333; padding: 15px; margin-top: 15px; }
    .card h2 { color: #aaffaa; font-size: 0.95em; margin: 0 0 8px; }
    .metric { font-size: 1.3em; color: #00ff88; }
    .hint { color: #666; margin-top: 30px; font-size: 0.85em; border-left: 3px solid #222; padding-left: 10px; }
  </style>
  <script src="static/config.js"></script>
</head>
<body>
<div class="box">
  <h1>Dashboard Interno</h1>
  <div class="card">
    <h2>Status</h2>
    <div class="metric">online</div>
  </div>
  <div class="card">
    <h2>Ambiente</h2>
    <div class="metric">production</div>
  </div>
  <div class="card">
    <h2>API</h2>
    <div class="metric">autenticada</div>
  </div>
  <div class="hint">Esta aplicação usa uma chave de API para acessar recursos internos. Inspecione os arquivos carregados pela página.</div>
</div>
</body>
</html>
