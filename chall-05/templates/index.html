<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>API Gateway</title>
  <style>
    body { font-family: monospace; background: #0f0f1a; color: #e0e0e0; display: flex; justify-content: center; padding: 60px 20px; }
    .box { max-width: 600px; width: 100%; }
    h1 { color: #00ff88; }
    p { color: #aaa; }
    code { background: #1a1a2e; padding: 2px 6px; border-radius: 3px; }
    .hint { color: #555; margin-top: 40px; font-size: 0.85em; border-left: 3px solid #222; padding-left: 10px; }
  </style>
</head>
<body>
<div class="box">
  <h1>API Gateway</h1>
  <p>Endpoint ativo. Faça uma requisição e analise a resposta completa.</p>
  <p>Às vezes as respostas HTTP falam mais do que o corpo da página.</p>
  <div class="hint">Dica: a resposta HTTP tem mais do que só o corpo — verifique os <code>headers</code>.</div>
</div>
</body>
</html>
