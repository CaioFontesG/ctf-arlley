version: '3.8'

networks:
  ctf_net:      # desafios 05-14 + CTFd + nginx
  rce_net:      # chall-15 + nginx (isolado dos demais desafios)

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/index.html:/usr/share/nginx/html/index.html:ro
    networks:
      - ctf_net
      - rce_net
    depends_on:
      - ctfd
      - chall-01
      - chall-02
      - chall-03
      - chall-04
      - chall-05
      - chall-07
      - chall-08
      - chall-09
      - chall-10
      - chall-11
      - chall-12
      - chall-13
      - chall-14
      - chall-15
      - chall-16
      - chall-17
      - chall-18

  ctfd:
    image: ctfd/ctfd
    expose:
      - "8000"
    env_file: .env
    environment:
      - REVERSE_PROXY=true
    volumes:
      - ctfd_data:/var/log/CTFd
      - ctfd_uploads:/var/uploads
      - ./ctfd-overrides/challenge.html:/opt/CTFd/CTFd/themes/core/templates/challenge.html:ro
    networks:
      - ctf_net
    restart: unless-stopped

  ctfd-init:
    image: python:3.11-slim
    command: >
      bash -c "pip install requests -q && python3 /scripts/ctfd_init.py"
    volumes:
      - ./ctfd_init.py:/scripts/ctfd_init.py:ro
    env_file: .env
    environment:
      - CTFD_URL=http://ctfd:8000
    networks:
      - ctf_net
    depends_on:
      - ctfd
    restart: "no"

  chall-02:
    build: ./chall-02
    expose:
      - "5000"
    networks:
      - ctf_net
    environment:
      - FLAG=${FLAG_COOKIE}

  chall-03:
    build: ./chall-03
    expose:
      - "5000"
    networks:
      - ctf_net
    environment:
      - FLAG=${FLAG_CONSOLE}

  chall-04:
    build: ./chall-04
    expose:
      - "5000"
    networks:
      - ctf_net
    environment:
      - FLAG=${FLAG_NETWORK}

  chall-05:
    build: ./chall-05
    expose:
      - "5000"
    networks:
      - ctf_net
    environment:
      - FLAG=${FLAG_CREDENCIAIS}

  chall-01:
    build: ./chall-01
    expose:
      - "5000"
    networks:
      - ctf_net
    environment:
      - FLAG=${FLAG_HTML_COMMENT}

  chall-06:
    build: ./chall-06
    ports:
      - "9099:9099"
    networks:
      - ctf_net
    environment:
      - FLAG=${FLAG_RECONHECIMENTO}

  chall-07:
    build: ./chall-07
    expose:
      - "5000"
    networks:
      - ctf_net
    environment:
      - FLAG=${FLAG_ENUMERACAO}

  chall-08:
    build: ./chall-08
    expose:
      - "5000"
    networks:
      - ctf_net
    environment:
      - FLAG=${FLAG_VALIDACAO_FRONT}

  chall-09:
    build: ./chall-09
    expose:
      - "5000"
    networks:
      - ctf_net
    environment:
      - FLAG=${FLAG_DEVTOOLS}

  chall-10:
    build: ./chall-10
    expose:
      - "5000"
    networks:
      - ctf_net
    environment:
      - FLAG=${FLAG_HEADER}

  chall-11:
    build: ./chall-11
    expose:
      - "5000"
    networks:
      - ctf_net
    environment:
      - FLAG=${FLAG_FUZZING}

  chall-12:
    build: ./chall-12
    expose:
      - "5000"
    networks:
      - ctf_net
    environment:
      - FLAG=${FLAG_LFI}

  chall-13:
    build: ./chall-13
    expose:
      - "5000"
    networks:
      - ctf_net
    environment:
      - FLAG=${FLAG_SQL_INJECTION}

  chall-14:
    build: ./chall-14
    expose:
      - "5000"
    networks:
      - ctf_net
    environment:
      - FLAG=${FLAG_UPLOAD}

  chall-15:
    build: ./chall-15
    expose:
      - "5000"
    networks:
      - rce_net
    environment:
      - FLAG=${FLAG_CADEIA}

  chall-16:
    build: ./chall-16
    expose:
      - "5000"
    networks:
      - ctf_net
    environment:
      - FLAG=${FLAG_PHISHING}

  chall-17:
    build: ./chall-17
    expose:
      - "5000"
    networks:
      - ctf_net
    environment:
      - FLAG=${FLAG_LGPD}

  chall-18:
    build: ./chall-18
    expose:
      - "5000"
    networks:
      - ctf_net

  chall-finish:
    build: ./chall-finish
    expose:
      - "5000"
    networks:
      - ctf_net
    environment:
      - CTFD_URL=http://ctfd:8000
      - TOTAL_CHALLENGES=18
      - FLAG=${FLAG_CONCLUSAO}

volumes:
  ctfd_data:
  ctfd_uploads:
