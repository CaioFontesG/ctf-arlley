<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Análise Forense — Evidência</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: monospace;
      background: #0f0f1a;
      color: #e0e0e0;
      padding: 40px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 { color: #00ff88; margin-bottom: 6px; text-align: center; }
    .subtitle {
      color: #666;
      font-size: 0.9em;
      margin-bottom: 28px;
      max-width: 720px;
      text-align: center;
      line-height: 1.5;
    }
    .frame {
      background: #16213e;
      border: 1px solid #0f3460;
      border-radius: 8px;
      padding: 12px;
      max-width: 900px;
      width: 100%;
    }
    .frame img {
      width: 100%;
      display: block;
      border-radius: 4px;
    }
    .footer {
      margin-top: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.8em;
    }
    .footer span { color: #888; }
    .footer a {
      color: #00ff88;
      text-decoration: none;
      border: 1px solid #00ff88;
      padding: 3px 12px;
      border-radius: 3px;
    }
    .footer a:hover { background: #00ff8822; }
  </style>
</head>
<body>
  <h1>Análise Forense</h1>
  <p class="subtitle">
    Esta imagem foi recuperada de uma máquina suspeita.
    A informação que procuramos não foi escondida com nenhuma ferramenta —
    ela está bem ali, à vista. Olhe com atenção.
  </p>

  <div class="frame">
    <img src="images/evidencia.jpg" alt="evidência recuperada">
    <div class="footer">
      <span>evidencia.jpg</span>
      <a href="images/evidencia.jpg" download="evidencia.jpg">download</a>
    </div>
  </div>
</body>
</html>
