<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>LASETE CTF — Conclusão</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: monospace;
      background: #0f0f1a;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .card {
      max-width: 480px;
      width: 100%;
      background: #16213e;
      border: 1px solid #0f3460;
      border-radius: 8px;
      padding: 40px 36px;
      text-align: center;
    }
    .logo { color: #00ff88; font-size: 1.1em; letter-spacing: 4px; margin-bottom: 8px; }
    h1 { color: #e0e0e0; font-size: 1.4em; margin-bottom: 8px; }
    .subtitle { color: #666; font-size: 0.85em; margin-bottom: 32px; line-height: 1.5; }
    label { display: block; text-align: left; color: #888; font-size: 0.8em; margin-bottom: 6px; }
    input[type=text] {
      width: 100%;
      background: #0d0d1a;
      border: 1px solid #444;
      color: #e0e0e0;
      padding: 10px 14px;
      font-family: monospace;
      font-size: 1em;
      border-radius: 4px;
      margin-bottom: 16px;
    }
    input[type=text]:focus { outline: none; border-color: #00ff88; }
    button {
      width: 100%;
      background: #00ff88;
      color: #000;
      border: none;
      padding: 12px;
      font-family: monospace;
      font-size: 1em;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background: #00cc6a; }
    .error {
      margin-top: 18px;
      color: #ff4444;
      font-size: 0.85em;
      background: #1a0000;
      border: 1px solid #440000;
      border-radius: 4px;
      padding: 10px 14px;
    }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">LASETE</div>
  <h1>CTF — Verificação de Conclusão</h1>
  <p class="subtitle">
    Digite seu nome de usuário do CTFd para verificar se você completou todos os desafios.
  </p>
  <form method="POST" action="check">
    <label for="username">Nome de usuário</label>
    <input type="text" id="username" name="username" placeholder="seu_usuario" autocomplete="off" autofocus required>
    <button type="submit">Verificar</button>
  </form>
  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}
</div>
</body>
</html>
